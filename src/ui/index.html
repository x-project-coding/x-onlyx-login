<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:; font-src 'self'">
<title>OnlyX Login</title>
<style>
  /*
   * OnlyX's own identity, not an approximation of it: the accent is #00AEEF — the blue sampled from
   * the OnlyFans mark itself, which is what app.onlyx.ai and the creator's connect page use — the
   * neutral ladder is the connect page's, and the typeface is Public Sans, the product's own.
   *
   * The font is BUNDLED (fonts/public-sans-latin.woff2, SIL OFL) rather than fetched from Google:
   * this app signs a creator in, so it makes no request it does not have to, and it must look
   * right before it has a connection at all.
   */
  @font-face {
    font-family: 'Public Sans';
    font-style: normal;
    font-weight: 100 900;            /* one variable file covers the whole ladder */
    font-display: swap;
    src: url('./fonts/public-sans-latin.woff2') format('woff2');
  }

  :root {
    --brand: #00AEEF;                /* OnlyX / OnlyFans blue */
    --brand-strong: #33c1f3;
    --canvas: #0b0b0f;
    --panel: #17171c;
    --line: #26262e;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --ok: #22c55e;
    --bad: #f87171;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--canvas); color: var(--text);
    font: 14px/1.5 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }

  /* The mark: a dark disc with a blue ring — the OnlyX favicon, drawn in CSS so it stays crisp. */
  .mark {
    width: 22px; height: 22px; flex: 0 0 auto;
    border-radius: 50%;
    background: #09090b;
    box-shadow: inset 0 0 0 2.4px var(--brand);
  }
  .mark.lg { width: 64px; height: 64px; box-shadow: inset 0 0 0 7px var(--brand); position: relative; }
  /* The hero mark is the waiting screen's icon, and stillness there reads as a hang: a slow ripple
     off the ring says "alive, listening for your link". transform+opacity only, so a window left
     open all day animates on the compositor instead of repainting. */
  .mark.lg::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 2px var(--brand); animation: ripple 3s ease-out infinite; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .5; } 75%, 100% { transform: scale(1.5); opacity: 0; } }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -0.01em; }

  /* Bar mode: the 56px strip above the sign-in browser. */
  #bar { display: none; height: 56px; padding: 0 16px; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  body[data-mode="bar"] #bar { display: flex; }
  #bar .who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .who b { color: var(--text); font-weight: 600; }
  #bar .notice { display: none; flex: 1; min-width: 0; padding: 6px 10px; border-radius: 8px; background: rgba(251,191,36,.12); color: #fbbf24; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .notice.on { display: block; }
  #bar .spacer { flex: 1; }
  #bar .clock { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #bar .clock.late { color: #fbbf24; }

  /* Full mode: the app on its own. */
  #full { display: none; height: 100%; padding: 32px; overflow-y: auto; }
  body[data-mode="full"] #full { display: flex; }
  /* Centred by the card's own auto margins, not align/justify on #full: flex-centring a card
     taller than the window (the Help list on a small screen) pushes the overflow past BOTH edges,
     where body's overflow:hidden made it unreachable — Back button included. Auto margins centre
     every short card identically and let a tall one start at the top and scroll. */
  .card { width: min(520px, 100%); margin: auto; text-align: center; }
  .card .brand { margin-bottom: 30px; font-size: 17px; }
  /* The icon slot's geometry lives on the ID — which every state keeps — not on a class the
     renderer swaps: ui.js replaces the element's whole className per state, and v1.0.1's idle
     screen set `mark lg` without `.icon`, lost the centring margin that only `.icon` carried, and
     shipped the ring flush against the card's left edge. The ID outranks any class combination a
     future icon kind sets, so forgetting `.icon` can no longer move the slot. */
  #full-icon { width: 64px; height: 64px; margin: 0 auto 22px; }
  /* Explicit, because .icon's display:grid outranks the UA's [hidden] rule (author origin wins at
     equal specificity) — without this the help panel's "hidden" slot would still hold 86px. */
  #full-icon[hidden] { display: none; }
  .icon { border-radius: 50%; display: grid; place-items: center; font-size: 30px; }
  .icon.spin { border: 3px solid var(--line); border-top-color: var(--brand); animation: spin 1s linear infinite; }
  .icon.ok { background: rgba(34,197,94,.14); color: var(--ok); }
  .icon.bad { background: rgba(248,113,113,.14); color: var(--bad); }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 21px; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.015em; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  p.detail { margin-top: 6px; }
  .actions { margin-top: 26px; display: flex; gap: 10px; justify-content: center; }
  button {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--brand); border-color: var(--brand); color: #04131a; }
  button:hover { filter: brightness(1.1); }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .fine { margin-top: 22px; font-size: 12px; color: var(--muted); }

  /* The help panel: questions on the left rail's weight, answers in muted body text. */
  .help { text-align: left; margin: 0 0 22px; width: 100%; }
  .help dt { font-weight: 600; color: var(--text); margin-top: 16px; }
  .help dt:first-child { margin-top: 0; }
  .help dd { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  /* Scoped with :has so the error screen's Help/Close pair stays a row. */
  .actions:has(.help) { flex-direction: column; align-items: stretch; }
  a { color: var(--brand-strong); }
</style>
</head>
<body data-mode="full">
  <div id="bar">
    <span class="brand"><span class="mark"></span>OnlyX Login</span>
    <span class="who" id="bar-who"></span>
    <span class="notice" id="bar-notice"></span>
    <span class="spacer"></span>
    <span class="clock" id="bar-clock" title="How long this link stays open"></span>
    <button id="bar-help" type="button">Help</button>
  </div>
  <div id="full">
    <div class="card">
      <div class="brand"><span class="mark"></span>OnlyX Login</div>
      <div class="icon" id="full-icon"></div>
      <h1 id="full-title"></h1>
      <p id="full-text"></p>
      <p class="detail" id="full-detail"></p>
      <div class="actions" id="full-actions"></div>
      <div class="fine" id="full-fine"></div>
    </div>
  </div>
  <script src="./ui.js"></script>
</body>
</html>
