name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: End-to-end (a fake OnlyFans, tunnel and API; the real app under Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxkbcommon0 >/dev/null
          bash test/e2e/run.sh
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
      - name: A PACKAGED build boots (asar, ESM entry, no test hooks)
        run: bash test/e2e/packaged.sh
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
