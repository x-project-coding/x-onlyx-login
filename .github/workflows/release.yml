# Builds and publishes the installers when a `v*` tag is pushed (or by hand).
#
# Signing and notarization read these repository secrets; without them the workflow still produces
# installers, but unsigned ones, which macOS Gatekeeper and Windows SmartScreen warn about:
#   CSC_LINK, CSC_KEY_PASSWORD               Developer ID Application certificate (.p12, base64) + password
#   notarization — EITHER of:
#     APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER    (App Store Connect key; Apple's recommendation)
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD       Authenticode certificate (.pfx, base64) + password
# Notarization turns itself on when one full set is present; there is no flag to pass.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Notarization needs no flag: electron-builder runs it automatically as soon as one full set
      # of Apple credentials is in the environment, and `mac.notarize` exists only to DISABLE it.
      # An earlier version of this step passed `--config.mac.notarize=true` behind a shell
      # conditional, which was a no-op dressed up as the thing that turned notarization on.
      # Either credential set below works; the API key is the one Apple recommends.
      - name: Build, sign and notarize the Mac artifacts
        # AN UNSET SECRET IS AN EMPTY STRING, NOT AN ABSENT ONE. `CSC_LINK: ${{ secrets.CSC_LINK }}`
        # with no certificate configured hands electron-builder `CSC_LINK=""`, which it reads as a
        # certificate PATH, resolves against the project directory, and then reports as
        # `⨯ <project dir> not a file` — a message that names neither signing nor the variable.
        # Setting CSC_IDENTITY_AUTO_DISCOVERY=false does not help, because the empty path is already
        # a configured certificate as far as it is concerned. The variables have to be UNSET.
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No Developer ID certificate configured — building an UNSIGNED DMG."
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WITHOUT A CERTIFICATE, SIGNING MUST BE TURNED OFF EXPLICITLY. Left on, electron-builder
          # still enters its signing path, finds no identity, and dies with the useless
          # "<project dir> not a file". Auto-discovery is enabled only when a cert is actually
          # present, so this same workflow signs the moment CSC_LINK is set and stays buildable
          # until then.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Preferred: an App Store Connect API key.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Or an Apple ID with an app-specific password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/OnlyX-Login-*-mac.dmg
            dist/OnlyX-Login-*-mac.dmg.blockmap
            dist/OnlyX-Login-*-mac.zip
            dist/OnlyX-Login-*-mac.zip.blockmap
            dist/latest-mac.yml
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and sign the Windows installer
        run: npx electron-builder --win --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/OnlyX-Login-*-win.exe
            dist/OnlyX-Login-*-win.exe.blockmap
            dist/latest.yml
  publish:
    needs: [test, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "Run this workflow against an existing v* tag."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true
      # electron-builder publishes different files concurrently. When each publisher races to find
      # a draft by tag, GitHub can receive two or three drafts for one version. Create the release
      # exactly once, after both platform jobs have produced every artifact.
      - name: Create one complete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f -print | sort)
          if (( ${#release_files[@]} == 0 )); then
            echo "No release artifacts were downloaded."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "OnlyX Login ${GITHUB_REF_NAME#v}" \
            --notes "Installers for macOS and Windows. The macOS app is Developer ID-signed and Apple-notarized."
